---
layout: splash
title: Contact
permalink: /contact/
---

<div class="contact-page">
  <h1 class="contact-page__title">Contact</h1>

  <form
    class="contact-form"
    action="mailto:{{ site.author.email | escape }}"
    method="post"
    enctype="text/plain"
  >
    <div class="contact-form__fields">
      <div class="contact-form__field">
        <label for="contact-name">Name</label>
        <input
          id="contact-name"
          name="Name"
          type="text"
          autocomplete="name"
          required
        />
      </div>

      <div class="contact-form__field">
        <label for="contact-email">Email</label>
        <input
          id="contact-email"
          name="Email"
          type="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="contact-form__field contact-form__field--message">
        <label for="contact-message">Message</label>
        <textarea
          id="contact-message"
          name="Message"
          rows="6"
          required
        ></textarea>
      </div>
    </div>

    <div class="contact-form__actions">
      <button class="contact-form__submit" type="submit">Send message</button>
      <button class="contact-form__reset" type="reset">Reset</button>
    </div>
  </form>

  <ul class="contact-social" aria-label="Social media">
    {% if site.author.linkedin %}
    <li>
      <a
        href="https://www.linkedin.com/in/{{ site.author.linkedin | escape }}"
        aria-label="LinkedIn"
        title="LinkedIn"
        ><i class="fab fa-linkedin-in" aria-hidden="true"></i
      ></a>
    </li>
    {% endif %} {% if site.author.facebook %}
    <li>
      <a
        href="https://www.facebook.com/{{ site.author.facebook | escape }}"
        aria-label="Facebook"
        title="Facebook"
        ><i class="fab fa-facebook-f" aria-hidden="true"></i
      ></a>
    </li>
    {% endif %} {% if site.author.instagram %}
    <li>
      <a
        href="https://www.instagram.com/{{ site.author.instagram | escape }}"
        aria-label="Instagram"
        title="Instagram"
        ><i class="fab fa-instagram" aria-hidden="true"></i
      ></a>
    </li>
    {% endif %}
  </ul>
</div>
